name: VpsCT CI environment
description: Restore tool caches and the verified build from this workflow run.
inputs:
  bundle:
    description: Restore the source job build artifact
    default: 'true'
  node:
    description: Install Node.js and restore npm cache
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: go.mod
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      if: inputs.node == 'true'
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: web/package-lock.json
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      if: inputs.bundle == 'true'
      with:
        name: ci-build
        path: ${{ runner.temp }}/ci-inputs
    - name: Verify and restore this run's build inputs
      if: inputs.bundle == 'true'
      shell: bash
      run: python3 scripts/ci-proof.py unpack "$RUNNER_TEMP/ci-inputs"
