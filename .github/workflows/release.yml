name: Release draft
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  package:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build versioned packages
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: make release VERSION="$RELEASE_VERSION" REPOSITORY="$RELEASE_REPOSITORY"
      - name: Prepare release notes
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/release-notes.py > release-notes.md
      - name: Create draft for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo 'Release already exists; keeping its assets unchanged. Replacement requires an explicit maintainer operation.'
            exit 0
          fi
          gh release create "$RELEASE_VERSION" --verify-tag --draft \
            --title "VpsCT $RELEASE_VERSION" --notes-file release-notes.md \
            release/"$RELEASE_VERSION"/*
