name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      soak_seconds:
        description: 'UDP soak: 60s daily regression; 600s release acceptance'
        type: choice
        options: ['60', '600']
        default: '600'
env:
  UDP_STRESS_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.soak_seconds || contains(github.event.pull_request.labels.*.name, 'release-candidate') && '600' || '60' }}
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-env
        with:
          bundle: 'false'
      - name: Fast static and CI tool checks
        run: |
          if ! command -v shellcheck >/dev/null; then sudo apt-get update && sudo apt-get install -y shellcheck; fi
          shellcheck install.sh uninstall.sh scripts/*.sh scripts/installer-test/*.sh scripts/uninstaller-test/*.sh internal/assets/install-agent.sh
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          python3 scripts/test-ci-tools.py
          bash scripts/test-installer.sh
          bash scripts/test-uninstaller.sh
  source:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      tree: ${{ steps.bundle.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-env
        with:
          bundle: 'false'
          node: 'true'
      - name: Download locked module graph before expensive tests
        run: bash scripts/ci-fetch-modules.sh
      - name: Frontend, contracts, Go source and client tests
        env:
          CTLVPS_TEST_PROGRESS: '1'
        run: bash scripts/check.sh
      - name: Dependency notices
        run: |
          python3 scripts/third-party.py
          git diff --exit-code -- THIRD_PARTY_NOTICES.md third_party
          test -z "$(git ls-files --others --exclude-standard third_party)"
      - name: Build shared AMD64 candidate without rebuilding frontend
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: make release-binaries VERSION=v0.1.999-ci REPOSITORY="$RELEASE_REPOSITORY"
      - name: Verify official shared test fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/fetch-network-test-fixtures.py .ci/fixtures --arch amd64 --manifest-only
      - name: Bind shared build to this run and source tree
        id: bundle
        run: |
          python3 scripts/ci-proof.py build "$RUNNER_TEMP/ci-output"
          printf 'tree=%s\n' "$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-build
          path: ${{ runner.temp }}/ci-output/
          retention-days: 7
          compression-level: 0
          overwrite: true
  race:
    name: Race (${{ matrix.group }})
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        group: [store, api, support]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-env
      - name: Race tests with live progress and bounded test timeout
        env:
          CI_CASE: ${{ matrix.group }}
        run: bash scripts/ci-scenarios.sh race "$CI_CASE"
  integration:
    name: Integration (${{ matrix.kind }})
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        kind: [install, maintenance, meter, browser, docker, regressions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-env
        with:
          node: ${{ matrix.kind == 'browser' }}
      - name: Isolated integration
        env:
          CI_CASE: ${{ matrix.kind }}
        run: bash scripts/ci-scenarios.sh integration "$CI_CASE"
  network:
    name: Network (${{ matrix.kind }})
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        kind: [managed, direct, ssh, wireguard, udp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-env
      - name: Native AMD64 network lifecycle
        env:
          CI_CASE: ${{ matrix.kind }}
        run: bash scripts/ci-scenarios.sh network "$CI_CASE"
  alpine:
    name: Alpine (${{ matrix.kind }})
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        kind: [install, memory, protocols, maintenance]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-env
      - name: Native AMD64 Alpine lifecycle
        env:
          CI_CASE: ${{ matrix.kind }}
        run: bash scripts/ci-scenarios.sh alpine "$CI_CASE"
  soak:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-env
      - name: UDP soak (60s daily; 600s release candidate)
        run: bash scripts/ci-scenarios.sh soak udp
  upgrade:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-env
      - name: Real historical web upgrade and unchanged subscription traffic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/fetch-network-test-fixtures.py .ci/fixtures --arch amd64 --catalog .ci/fixtures/catalog.json --only sing-box
          bash scripts/fetch-upgrade-fixture.sh v0.1.5 "$RUNNER_TEMP/web-upgrade-legacy"
          SINGBOX_BIN="$PWD/.ci/fixtures/sing-box" bash scripts/test-web-upgrade-container.sh release/v0.1.999-ci "$RUNNER_TEMP/web-upgrade-legacy"
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-env
        with:
          bundle: 'false'
          node: 'true'
      - name: Secret scan (redacted)
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner .
      - name: Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Frontend dependency audit
        working-directory: web
        run: npm audit --audit-level=high
  checks:
    if: always()
    needs: [lint, source, race, integration, network, alpine, soak, upgrade, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require every gate and record exact-source evidence
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci-proof.py evidence "$RUNNER_TEMP/ci-evidence"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-evidence
          path: ${{ runner.temp }}/ci-evidence/ci-evidence.json
          retention-days: 7
          overwrite: true
