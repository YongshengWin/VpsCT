name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      soak_seconds:
        description: 'Acceptance: 60s UDP + ACME handshake; 600s UDP + native ACME renewal'
        type: choice
        options: ['60', '600']
        default: '600'
      soak_sessions:
        description: '1024 release baseline; 8192 experimental capacity diagnostic'
        type: choice
        options: ['1024', '8192']
        default: '1024'
env:
  UDP_STRESS_SESSIONS: ${{ inputs.soak_sessions || '1024' }}
  UDP_STRESS_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.soak_seconds || contains(github.event.pull_request.labels.*.name, 'release-candidate') && '600' || '60' }}
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-env
        with:
          bundle: 'false'
      - name: Fast static and CI tool checks
        run: |
          if ! command -v shellcheck >/dev/null; then sudo apt-get update && sudo apt-get install -y shellcheck; fi
          shellcheck install.sh uninstall.sh scripts/*.sh scripts/installer-test/*.sh scripts/uninstaller-test/*.sh internal/assets/install-agent.sh
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          python3 scripts/test-ci-tools.py
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      tree: ${{ steps.bundle.outputs.tree }}
      acme_profile: ${{ steps.bundle.outputs.acme_profile }}
      acme_matrix: ${{ steps.bundle.outputs.acme_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-env
        with:
          bundle: 'false'
          node: 'true'
      - name: Download locked module graph before expensive tests
        run: bash scripts/ci-fetch-modules.sh
      - name: Frontend, contracts, Go source and client tests
        env:
          CTLVPS_TEST_PROGRESS: '1'
        run: bash scripts/check.sh
      - name: Dependency notices
        run: |
          python3 scripts/third-party.py
          git diff --exit-code -- THIRD_PARTY_NOTICES.md third_party
          test -z "$(git ls-files --others --exclude-standard third_party)"
      - name: Build shared AMD64 candidate without rebuilding frontend
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          make release-binaries VERSION=v0.1.999-ci REPOSITORY="$RELEASE_REPOSITORY"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/proxy-hardening-test-linux-amd64 ./scripts/proxy-hardening-test
      - name: Verify official shared test fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/fetch-network-test-fixtures.py .ci/fixtures --arch amd64 --manifest-only
      - name: Bind shared build to this run and source tree
        id: bundle
        run: |
          python3 scripts/ci-proof.py build "$RUNNER_TEMP/ci-output"
          printf 'tree=%s\n' "$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          # Use the same daily/release profile as the UDP soak. Both complete
          # ACME scenarios run in parallel only for release acceptance.
          case "$UDP_STRESS_SECONDS" in
            60)
              printf 'acme_profile=handshake\n' >> "$GITHUB_OUTPUT"
              printf 'acme_matrix=[{"scenario":"handshake","timeout":12}]\n' >> "$GITHUB_OUTPUT"
              ;;
            600)
              printf 'acme_profile=renewal\n' >> "$GITHUB_OUTPUT"
              printf 'acme_matrix=[{"scenario":"handshake","timeout":12},{"scenario":"renewal","timeout":18}]\n' >> "$GITHUB_OUTPUT"
              ;;
            *) echo 'unsupported CI acceptance profile' >&2; exit 2;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-build
          path: ${{ runner.temp }}/ci-output/
          retention-days: 7
          compression-level: 0
          overwrite: true
  race-store:
    name: Race (store)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-env
        with:
          bundle: 'false'
      - run: bash scripts/ci-scenarios.sh race store
  race:
    name: Race (${{ matrix.group }})
    needs: [lint, source]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        group: [api, support]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-env
      - name: Race tests with live progress and bounded test timeout
        env:
          CI_CASE: ${{ matrix.group }}
        run: bash scripts/ci-scenarios.sh race "$CI_CASE"
  integration:
    name: Integration (${{ matrix.kind }})
    needs: [lint, source]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        kind: [install, maintenance, meter, browser, docker, regressions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-env
        with:
          node: ${{ matrix.kind == 'browser' }}
      - name: Isolated integration
        env:
          CI_CASE: ${{ matrix.kind }}
        run: bash scripts/ci-scenarios.sh integration "$CI_CASE"
  network:
    name: Network (${{ matrix.kind }})
    needs: [lint, source]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        kind: [managed, direct, ssh, wireguard, udp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-env
      - name: Native AMD64 network lifecycle
        env:
          CI_CASE: ${{ matrix.kind }}
        run: bash scripts/ci-scenarios.sh network "$CI_CASE"
  alpine:
    name: Alpine (${{ matrix.kind }})
    needs: [lint, source]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        kind: [install, memory, protocols, maintenance]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-env
      - name: Native AMD64 Alpine lifecycle
        env:
          CI_CASE: ${{ matrix.kind }}
        run: bash scripts/ci-scenarios.sh alpine "$CI_CASE"
  soak:
    needs: [lint, source]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-env
      - name: UDP baseline 1024 sessions (60s daily; 600s release)
        run: bash scripts/ci-scenarios.sh soak udp
  upgrade:
    needs: [lint, source]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-env
      - name: Real historical web upgrade and unchanged subscription traffic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/fetch-network-test-fixtures.py .ci/fixtures --arch amd64 --catalog .ci/fixtures/catalog.json --only sing-box
          bash scripts/fetch-upgrade-fixture.sh v0.1.5 "$RUNNER_TEMP/web-upgrade-legacy"
          SINGBOX_BIN="$PWD/.ci/fixtures/sing-box" bash scripts/test-web-upgrade-container.sh release/v0.1.999-ci "$RUNNER_TEMP/web-upgrade-legacy"
  acme:
    name: ACME (${{ matrix.scenario }})
    needs: [lint, source]
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.source.outputs.acme_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-env
      - name: Official kernel ACME lifecycle
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CASE: ${{ matrix.scenario }}
        run: bash scripts/ci-scenarios.sh acme "$CI_CASE"
  security-audit:
    uses: ./.github/workflows/security.yml
  security:
    # Keep the exact check context required by existing branch protection.
    name: security
    if: always()
    needs: security-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every security audit
        env:
          AUDIT_RESULT: ${{ needs.security-audit.result }}
        run: |
          if [[ "$AUDIT_RESULT" != success ]]; then
            echo "Security audit did not succeed: $AUDIT_RESULT" >&2
            exit 1
          fi
  checks:
    if: always()
    needs: [lint, source, race-store, race, integration, network, alpine, soak, upgrade, acme, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require every gate and record exact-source evidence
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
          ACME_PROFILE: ${{ needs.source.outputs.acme_profile }}
        run: python3 scripts/ci-proof.py evidence "$RUNNER_TEMP/ci-evidence"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-evidence
          path: ${{ runner.temp }}/ci-evidence/ci-evidence.json
          retention-days: 7
          overwrite: true
