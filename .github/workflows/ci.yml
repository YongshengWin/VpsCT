name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Clean build and tests
        run: bash scripts/check.sh
      - name: Concurrent initialization and authentication
        run: go test -race ./internal/auth ./internal/store ./internal/api ./internal/geoip ./internal/maintenance ./internal/agent ./internal/secureupdate ./internal/safehttp ./internal/backup ./internal/connlog
      - name: Shell and workflow checks
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck install.sh uninstall.sh scripts/*.sh scripts/installer-test/*.sh scripts/uninstaller-test/*.sh internal/assets/install-agent.sh
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Check dependency notices
        run: |
          go mod download all
          python3 scripts/third-party.py
          git diff --exit-code -- THIRD_PARTY_NOTICES.md third_party
          test -z "$(git ls-files --others --exclude-standard third_party)"
      - name: Build release fixture
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: make release VERSION=v0.0.0-ci REPOSITORY="$RELEASE_REPOSITORY"
      - name: Installer integration (isolated container)
        run: bash scripts/test-install-container.sh release/v0.0.0-ci
      - name: Uninstaller integration (isolated systemd container)
        run: bash scripts/test-uninstall-container.sh
      - name: Web maintenance integration (isolated systemd container)
        run: bash scripts/test-maintenance-container.sh release/v0.0.0-ci
      - name: Proxy kernel isolation (disposable containers)
        run: bash scripts/test-meter-container.sh
      - name: Parser fuzz budget
        run: go test ./internal/proxynode -run '^$' -fuzz FuzzParseAny -fuzztime 20s -parallel 2
      - name: Real browser origin and CSP checks
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-save playwright@1.62.1
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
          go build -o "$RUNNER_TEMP/browser-controller" ./cmd/ctlvpsd
          PLAYWRIGHT_MODULE_DIR="$RUNNER_TEMP/browser/node_modules" CTLVPS_TEST_BINARY="$RUNNER_TEMP/browser-controller" node scripts/security-browser.mjs
      - name: Docker build and first-run smoke test
        run: bash scripts/test-docker.sh
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Secret scan (redacted)
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner .
      - name: Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Frontend dependency audit
        working-directory: web
        run: npm audit --audit-level=high
  network:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build embedded frontend
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: Verify official AMD64 network test kernel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset=sing-box-1.14.1-linux-amd64.tar.gz
          digest=$(gh api repos/SagerNet/sing-box/releases/tags/v1.14.1 --jq ".assets[] | select(.name == \"$asset\") | .digest")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          curl -fLsS --proto '=https' --proto-redir '=https' "https://github.com/SagerNet/sing-box/releases/download/v1.14.1/$asset" -o "$RUNNER_TEMP/$asset"
          printf '%s  %s\n' "${digest#sha256:}" "$RUNNER_TEMP/$asset" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP"
          echo "SINGBOX_BIN=$RUNNER_TEMP/sing-box-1.14.1-linux-amd64/sing-box" >> "$GITHUB_ENV"
      - name: AMD64 real agent and systemd network verification
        env:
          NETWORK_TEST_ARCH: amd64
        run: |
          for scenario in transit-ss2022 forward subscriptions; do
            NETWORK_SYSTEMD_CASE="$scenario" bash scripts/test-network-systemd-container.sh
          done
      - name: Historical web upgrade and unchanged subscription traffic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/fetch-upgrade-fixture.sh v0.1.5 "$RUNNER_TEMP/web-upgrade-legacy"
          make release VERSION=v0.1.999-upgrade-ci REPOSITORY=YongshengWin/VpsCT
          bash scripts/test-web-upgrade-container.sh release/v0.1.999-upgrade-ci "$RUNNER_TEMP/web-upgrade-legacy"
  compatibility:
    name: Compatibility (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 65
    env:
      FIXTURE_ARCH: ${{ matrix.arch }}
      NETWORK_TEST_ARCH: ${{ matrix.arch }}
      ALPINE_TEST_ARCH: ${{ matrix.arch }}
      ISSUE_TEST_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build embedded frontend
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: Native systemd, cgroup, nftables and seccomp regressions
        run: bash scripts/test-issue-regressions-container.sh
      - name: Native Alpine first install and terminal update
        run: bash scripts/test-alpine-installer-container.sh
      - name: Verify official tunnel and Alpine test fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch-network-test-fixtures.py "$RUNNER_TEMP/issue-fixtures" --arch "$FIXTURE_ARCH"
      - name: Native multihomed, SSH and WireGuard lifecycle
        env:
          NETWORK_TEST_CLIENT: shadowsocks-rust
        run: |
          export SINGBOX_BIN="$RUNNER_TEMP/issue-fixtures/sing-box"
          export SSLOCAL_BIN="$RUNNER_TEMP/issue-fixtures/sslocal"
          for scenario in direct ssh wireguard; do
            NETWORK_SYSTEMD_CASE="$scenario" bash scripts/test-network-systemd-container.sh
          done
      - name: Native Alpine services, accounting and maintenance
        run: |
          export SINGBOX_MUSL_BIN="$RUNNER_TEMP/issue-fixtures/sing-box-musl"
          export MITA_BIN="$RUNNER_TEMP/issue-fixtures/mita"
          export MIERU_BIN="$RUNNER_TEMP/issue-fixtures/mieru"
          ALPINE_TEST_MEMORY='256m 512m' bash scripts/test-alpine-container.sh
          ALPINE_TEST_CASE=mita ALPINE_TEST_MEMORY=512m bash scripts/test-alpine-container.sh
          ALPINE_TEST_CASE=udp ALPINE_TEST_MEMORY=512m bash scripts/test-alpine-container.sh
          MAINTENANCE_INIT=openrc bash scripts/test-maintenance-container.sh
          MAINTENANCE_INIT=openrc ALPINE_TEST_PURGE=1 bash scripts/test-maintenance-container.sh
      - name: Native UDP forwarding lifecycle and proxy exits
        run: |
          export SINGBOX_BIN="$RUNNER_TEMP/issue-fixtures/sing-box"
          for scenario in forward-udp forward-both forward-udp6 forward-socks-udp forward-wireguard-udp; do
            NETWORK_SYSTEMD_CASE="$scenario" bash scripts/test-network-systemd-container.sh
          done
      - name: Native UDP capacity and ten-minute soak
        env:
          UDP_STRESS_SECONDS: '600'
          NETWORK_SYSTEMD_CASE: forward-stress
        run: |
          export SINGBOX_BIN="$RUNNER_TEMP/issue-fixtures/sing-box"
          bash scripts/test-network-systemd-container.sh
